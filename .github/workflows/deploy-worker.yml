name: Deploy Palia AI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: palia-ai-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: npm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy cloudflare-worker/index.js --name paliaai
          secrets: |
            PALIA_HF_TOKEN
            PALIA_GEMINI_API_KEY
        env:
          PALIA_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PALIA_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
