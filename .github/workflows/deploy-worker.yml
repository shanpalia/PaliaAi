name: Deploy Palia AI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-ai-worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: palia-ai-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy Cloudflare Workers AI
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: npm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare-ai-worker/wrangler.toml
