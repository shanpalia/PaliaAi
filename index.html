<style>

}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.header{height:60px;flex:none;border-bottom:1px solid #edf0f2;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:20}.lefthead,.righthead,.tabs{display:flex;align-items:center;gap:6px}.hamb{display:none;border:0;background:transparent;width:38px;height:38px;border-radius:10px}.hamb:hover{background:var(--hover)}.tab{border:0;background:transparent;color:#667085;font-size:13px;font-weight:650;padding:9px 12px;border-radius:10px}.tab.active{color:#047857;background:#ecfdf5;box-shadow:inset 0 -2px 0 var(--green)}.iconbtn{width:36px;height:36px;border:0;background:transparent;border-radius:10px;color:#667085;display:grid;place-items:center}.iconbtn:hover{background:var(--hover);color:#111827}.avatar{width:34px;height:34px;border:0;border-radius:50%;background:linear-gradient(135deg,#10b981,#14b8a6);color:#fff;font-weight:800}

.composer-wrap{position:fixed;left:270px;right:0;bottom:0;padding:24px 18px 18px;background:linear-gradient(transparent,#fff 30%);z-index:15}.composer{width:min(900px,100%);margin:auto;border:1px solid #d8dde3;background:#fff;border-radius:19px;padding:8px 10px;box-shadow:0 8px 30px rgba(15,23,42,.07)}.attachrow{display:flex;align-items:center;gap:7px;min-height:30px}.attach{width:36px;height:36px;border:0;background:#f1f3f5;border-radius:10px;color:#475467;font-size:21px}.attach:hover{background:#e8eaed}.mode{height:34px;border:0;background:#f1f3f5;border-radius:10px;padding:0 10px;color:#475467;font-size:12px}.mode.active{background:#ecfdf5;color:#047857}.inputrow{display:flex;align-items:flex-end;gap:7px}.textarea{flex:1;min-height:44px;max-height:150px;resize:none;border:0;outline:0;padding:10px 8px;font-size:15px}.send{width:42px;height:42px;border:0;border-radius:12px;background:#111827;color:#fff;font-size:18px}.send:disabled{opacity:.45}.filechips{display:flex;flex-wrap:wrap;gap:6px;padding:5px 2px}.filechip{display:flex;align-items:center;gap:6px;border:1px solid #e1e5ea;background:#f8fafc;border-radius:9px;padding:6px 8px;font-size:11px;color:#475467}.filechip button{border:0;background:transparent;color:#667085;padding:0}
.drawer{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.22);display:none}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(390px,92vw);background:#fff;padding:20px;box-shadow:-12px 0 40px rgba(0,0,0,.14);overflow:auto}.panelhead{display:flex;align-items:center;justify-content:space-between}.close{width:34px;height:34px;border:0;border-radius:9px;background:#f1f3f5}.profilebox,.usagebox{border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:18px}.usagehead,.statrow{display:flex;justify-content:space-between;gap:10px;font-size:13px}.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:11px 0}.fill{height:100%;background:linear-gradient(90deg,#10b981,#14b8a6)}.panelnav{margin-top:15px}.panelnav button{width:100%;padding:11px;border:1px solid var(--line);background:#fff;text-align:left;border-radius:10px;margin-bottom:7px}.muted{color:var(--muted);font-size:13px}.confirm{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.3);display:grid;place-items:center;padding:15px}.confirmbox{width:min(380px,100%);background:#fff;border-radius:17px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.2)}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.confirm-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px}.confirm-actions .danger{background:#dc2626;color:#fff;border-color:#dc2626}.typing{display:inline-flex;gap:4px;padding:7px}.typing i{width:6px;height:6px;border-radius:50%;background:#98a2b3;animation:b .8s infinite alternate}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{to{opacity:.25;transform:translateY(-2px)}}
@media(max-width:800px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-100%);transition:transform .2s}.sidebar.mobileopen{transform:translateX(0)}.hamb{display:block}.composer-wrap{left:0;padding:12px 10px 10px}.chat{padding:24px 12px 150px}.welcome{margin-top:11vh}.welcome h1{font-size:29px}.suggestions{grid-template-columns:1fr}.bubble{max-width:90%}.tabs{gap:0}.tab{padding:8px 9px}.righthead .iconbtn{display:none}}
</style>

<body><div id="app"></div>
<script>
const CONFIG={SUPABASE_URL:"https://ralinnuegsbuvlhwpzln.supabase.co",FUNCTION_NAME:"palia-ai"};
const state={messages:[],currentChatId:null,mode:"chat",loading:false,drawer:false,userId:"",usage:{used_seconds:0,daily_limit_seconds:7200,remaining_seconds:7200},pendingFiles:[],conversations:[]};
const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function getUserId(){let x=localStorage.getItem("palia_user_id");if(!x){x="guest_"+crypto.randomUUID();localStorage.setItem("palia_user_id",x)}return x}state.userId=getUserId();
function endpoint(){return CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/"+CONFIG.FUNCTION_NAME}
async function callAI(payload){const r=await fetch(endpoint(),{method:"POST",mode:"cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,userId:state.userId,timezone:"Asia/Kolkata"})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Palia AI request failed (${r.status})`);return d}
function fmt(sec){sec=Math.max(0,Math.floor(sec||0));if(sec<60)return sec+"s";const m=Math.floor(sec/60),h=Math.floor(m/60),mm=m%60;return h?`${h}h ${mm}m`:m+"m"}
function render(){document.querySelector("#app").innerHTML=`<aside class="sidebar"><div class="brand"><div class="logo">P</div>Palia AI</div><button class="newchat" id="new">＋ New Chat</button><input class="side-search" id="chatSearch" placeholder="Search chats"><div class="side-title">Recent chats</div><div class="history" id="history"></div><div class="bottomside"><button class="navbtn" id="tools">⚙ Tools</button><button class="navbtn" id="archived">📁 Archived Chats</button><button class="navbtn" id="about">ⓘ About Palia AI</button></div></aside><main class="main"><header class="header" id="header"></header><section class="content"><div class="chat" id="chat"></div><div class="composer-wrap" id="composer"></div></section></main><div class="drawer" id="drawer"></div>`;renderHeader();renderChat();renderHistory();renderDrawer();bind()}
function renderHeader(){$("#header").innerHTML=`<div class="lefthead"><button class="hamb" id="hamb">☰</button><div class="tabs"><button class="tab ${state.mode==='chat'?'active':''}" data-mode="chat">Chat</button><button class="tab ${state.mode==='tools'?'active':''}" data-mode="tools">Tools</button><button class="tab ${state.mode==='search'?'active':''}" data-mode="search">Web Search</button></div></div><div class="righthead"><button class="iconbtn" id="share" title="Share">↗</button><button class="iconbtn" id="settings" title="Settings">⚙</button><button class="avatar" id="profile">P</button></div>`}
function renderChat(){const c=$("#chat");if(state.mode==='tools'){c.innerHTML=`<div style="width:min(900px,100%);margin:auto;padding:30px 20px"><h2>Tools</h2><p class="muted">Use the + button to upload files, or ask Palia AI to create an image.</p></div>`;renderComposer();return}if(!state.messages.length){c.innerHTML=`<div class="welcome"><div class="biglogo">P</div><h1>How can I help you today?</h1><p>Chat, search the web, analyze files and create images with Palia AI.</p><div class="suggestions"><button class="suggest" data-p="Mujhe PaliaAPK HUB ke liye ek modern app icon bana do">🎨 Create an app icon</button><button class="suggest" data-p="Is image ko analyze karke batao isme kya hai">🖼 Analyze an image</button><button class="suggest" data-search="1" data-p="Aaj India ki latest technology news kya hai?">🌐 Search the web</button><button class="suggest" data-p="Mujhe ek professional resume banane me help karo">✍️ Write something</button></div></div>`;renderComposer();return}let html='<div class="messages">';for(let i=0;i<state.messages.length;i++){const m=state.messages[i];const image=m.imageUrl?`<div class="generated"><img src="${esc(m.imageUrl)}" alt="Generated by Palia AI"><div class="image-actions"><a href="${esc(m.imageUrl)}" download="palia-ai-image.png">Download</a><button data-regenerate="1">Regenerate</button></div></div>`:"";const sources=(m.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||'Source')}</a>`).join('');html+=`<div class="msg ${m.role==='user'?'user':'ai'}"><div class="bubble ${m.error?'error':''}">${esc(m.text||'')}${image}${sources?`<div class="sources">${sources}</div>`:''}</div></div>`}if(state.loading)html+=`<div class="msg ai"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`;html+='</div>';c.innerHTML=html;c.querySelectorAll('[data-regenerate]').forEach(b=>b.onclick=regenerateLast);renderComposer();setTimeout(()=>{c.scrollTop=c.scrollHeight},0)}
function renderComposer(){const c=$("#composer");c.innerHTML=`<div class="composer"><div class="attachrow"><button class="attach" id="plus" title="Add files">＋</button><input id="fileInput" type="file" multiple accept="image/*,video/*,.pdf,.txt,.csv,.doc,.docx" hidden><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>${state.pendingFiles.map((f,i)=>`<span class="filechip">📎 ${esc(f.name.slice(0,25))}<button data-remove="${i}">×</button></span>`).join('')}<button class="mode ${state.mode==='search'?'active':''}" id="searchMode">${state.mode==='search'?'Web Search':'Palia AI'}</button></div><div class="inputrow"><textarea class="textarea" id="input" placeholder="Ask Palia AI..." rows="1"></textarea><button class="attach" id="mic" title="Voice">🎙</button><button class="send" id="send" title="Send">➤</button></div></div>`;const input=$("#input");input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$("#send").onclick=send;$("#mic").onclick=voiceInput;$("#plus").onclick=()=>{const r=document.querySelector('#fileInput');r.click()};$("#fileInput").onchange=e=>addFiles(e.target.files);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.pendingFiles.splice(Number(b.dataset.remove),1);renderComposer()});$("#searchMode").onclick=()=>{state.mode=state.mode==='search'?'chat':'search';renderHeader();renderComposer()}}
async function addFiles(list){for(const file of [...list]){if(file.size>25*1024*1024){alert(`${file.name} is too large. Maximum 25 MB.`);continue}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});state.pendingFiles.push({name:file.name,type:file.type||'application/octet-stream',data:String(data)})}renderComposer()}
function loadChats(){try{state.conversations=JSON.parse(localStorage.getItem('palia_chats')||'[]')}catch{state.conversations=[]}}
function saveChats(){localStorage.setItem('palia_chats',JSON.stringify(state.conversations))}
function cleanTitle(t){return String(t||'New Chat').replace(/\s+/g,' ').trim().slice(0,48)||'New Chat'}
function renderHistory(){loadChats();for(const c of state.conversations){const first=(c.messages||[]).find(m=>m.role==='user');if(first)c.title=cleanTitle(c.title&&c.title!=='M :'&&c.title!=='m :'&&c.title!=='M :'?c.title:first.text)}saveChats();const h=$("#history");const q=($("#chatSearch")?.value||'').toLowerCase();const list=state.conversations.filter(x=>!x.archived&&cleanTitle(x.title).toLowerCase().includes(q)).sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(b.updated_at||0)-(a.updated_at||0));h.innerHTML=list.map(x=>`<div class="history-item ${x.id===state.currentChatId?'active':''}"><button class="history-title" data-open="${esc(x.id)}">${x.pinned?'📌 ':''}${esc(cleanTitle(x.title))}</button><button class="chat-menu-btn" data-menu="${esc(x.id)}">⋮</button><div class="chat-menu" data-box="${esc(x.id)}" hidden><button data-action="rename" data-id="${esc(x.id)}">✏️ Rename</button><button data-action="pin" data-id="${esc(x.id)}">${x.pinned?'📌 Unpin':'📌 Pin'}</button><button data-action="archive" data-id="${esc(x.id)}">📁 Archive</button><button data-action="delete" data-id="${esc(x.id)}">🗑 Delete</button></div></div>`).join('');h.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();h.querySelectorAll('.chat-menu').forEach(x=>x.hidden=true);const box=h.querySelector(`[data-box="${CSS.escape(b.dataset.menu)}"]`);box.hidden=false});h.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const x=state.conversations.find(c=>c.id===b.dataset.open);if(x){state.currentChatId=x.id;state.messages=x.messages||[];state.mode='chat';renderHeader();renderChat();renderHistory()}});h.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const x=state.conversations.find(c=>c.id===b.dataset.id);if(!x)return;if(b.dataset.action==='rename'){const n=prompt('Chat name:',cleanTitle(x.title));if(n?.trim())x.title=cleanTitle(n)}else if(b.dataset.action==='pin')x.pinned=!x.pinned;else if(b.dataset.action==='archive'){x.archived=true;if(x.id===state.currentChatId){state.currentChatId=null;state.messages=[]}}else if(b.dataset.action==='delete'){confirmDelete(x)}saveChats();renderHistory();renderChat()});$("#chatSearch")?.addEventListener('input',renderHistory)}
function confirmDelete(x){const m=document.createElement('div');m.className='confirm';m.innerHTML=`<div class="confirmbox"><h3>Delete chat?</h3><p class="muted">“${esc(cleanTitle(x.title))}” will be permanently removed.</p><div class="confirm-actions"><button id="cancelDelete">Cancel</button><button class="danger" id="doDelete">Delete</button></div></div>`;document.body.appendChild(m);$("#cancelDelete").onclick=()=>m.remove();$("#doDelete").onclick=()=>{state.conversations=state.conversations.filter(c=>c.id!==x.id);if(state.currentChatId===x.id){state.currentChatId=null;state.messages=[]}saveChats();m.remove();renderHistory();renderChat()}}
function ensureChat(){loadChats();if(!state.currentChatId){state.currentChatId=crypto.randomUUID();state.conversations.unshift({id:state.currentChatId,title:'New Chat',messages:[],pinned:false,archived:false,updated_at:Date.now()})}return state.conversations.find(x=>x.id===state.currentChatId)}
function saveConversation(){const c=ensureChat();const first=state.messages.find(m=>m.role==='user');if(first)c.title=cleanTitle(first.text);c.messages=state.messages;c.updated_at=Date.now();saveChats();renderHistory()}
function renderDrawer(){const d=$("#drawer");const pct=state.usage.daily_limit_seconds?Math.min(100,state.usage.used_seconds/state.usage.daily_limit_seconds*100):0;d.innerHTML=`<div class="panel"><div class="panelhead"><strong>Account & Settings</strong><button class="close" id="closeDrawer">×</button></div><div class="profilebox"><strong>Palia AI</strong><div class="muted">Guest user</div></div><div class="usagebox"><div class="usagehead"><span>Daily AI Usage</span><span>${fmt(state.usage.remaining_seconds)} remaining</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="statrow"><span>${fmt(state.usage.used_seconds)} used</span><span>2h daily limit</span></div><p class="muted">Resets every day at midnight (India).</p></div><div class="panelnav"><button id="clearAll">Clear chat history</button><button id="export">Export conversation</button></div></div>`;d.classList.toggle('open',state.drawer);$("#closeDrawer").onclick=()=>{state.drawer=false;renderDrawer()};d.onclick=e=>{if(e.target===d){state.drawer=false;renderDrawer()}};$("#clearAll").onclick=()=>{if(confirm('Delete all recent chats?')){localStorage.removeItem('palia_chats');state.conversations=[];state.messages=[];state.currentChatId=null;state.drawer=false;render()}};$("#export").onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.messages,null,2)],{type:'application/json'}));a.download='palia-ai-chat.json';a.click()}}
function bind(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;renderHeader();renderChat();renderComposer()});$("#new").onclick=()=>{state.messages=[];state.pendingFiles=[];state.currentChatId=null;state.mode='chat';renderHeader();renderChat();renderHistory();renderComposer()};$("#hamb").onclick=()=>document.querySelector('.sidebar').classList.toggle('mobileopen');$("#profile").onclick=()=>{state.drawer=true;renderDrawer();refreshUsage()};$("#settings").onclick=()=>{state.drawer=true;renderDrawer();refreshUsage()};$("#share").onclick=()=>navigator.share?navigator.share({title:'Palia AI',text:'Chat with Palia AI'}):alert('Share is not available here.');$("#tools").onclick=()=>{state.mode='tools';renderHeader();renderChat()};$("#archived").onclick=()=>{loadChats();const a=state.conversations.filter(x=>x.archived);if(!a.length){alert('No archived chats.');return}if(confirm(a.map(x=>'• '+cleanTitle(x.title)).join('\n')+'\n\nRestore archived chats?')){a.forEach(x=>x.archived=false);saveChats();renderHistory()}};$("#about").onclick=()=>alert('Palia AI — developed by ShanPalia.');document.querySelectorAll('.suggest').forEach(b=>b.onclick=()=>{state.mode=b.dataset.search?'search':'chat';renderHeader();renderComposer();const i=$("#input");i.value=b.dataset.p;send()})}
function historyForAI(){return state.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-20).map(m=>({role:m.role,text:m.text}))}
function isImageRequest(t){
  const s=String(t||"").toLowerCase();
  const imageWords=/image|icon|logo|photo|picture|background|png|svg|cartoon|3d|avatar|tasveer|फोटो|इमेज|आइकन|लोगो|तस्वीर|चित्र/.test(s);
  const actionWords=/create|generate|make|draw|design|edit|transform|remove|replace|turn|convert|bana|banao|bana do|de do|karo|chahiye|dikhao|do|बना|बनाओ|बनादो|चाहिए|दे दो|करो/.test(s);
  return imageWords && actionWords;
}
async function send(){if(state.loading)return;const input=$("#input"),text=(input?.value||'').trim();if(!text&&!state.pendingFiles.length){alert('Please enter a message or attach a file.');return}const attachments=state.pendingFiles.map(x=>({...x}));state.messages.push({role:'user',text:text||'Please analyze the attached file(s).',attachments});saveConversation();state.pendingFiles=[];state.loading=true;renderChat();try{const image=isImageRequest(text);
    const action=image?"image":(state.mode==='search'?'search':'chat');
    const d=await callAI({action,message:image?`Create the actual image requested by the user. Return the generated image. Do not return a prompt, SVG, ASCII art, or design instructions. User request: ${text}`:text,history:historyForAI().slice(0,-1),attachments});if(!d.success)throw new Error(d.error||'Palia AI could not answer.');state.usage=d.usage||state.usage;state.messages.push({role:'assistant',text:d.text||d.reply||'',sources:d.sources||[],imageUrl:d.imageUrl||'',error:false});saveConversation()}catch(e){state.messages.push({role:'assistant',text:'⚠️ '+e.message,error:true});saveConversation()}finally{state.loading=false;renderChat();renderDrawer()}}
async function regenerateLast(){const u=[...state.messages].reverse().find(x=>x.role==='user');if(!u)return;state.messages=state.messages.filter(x=>x!==u);state.pendingFiles=u.attachments||[];renderChat();$("#input").value=u.text;await send()}
function voiceInput(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice input is not supported in this browser.');return}const r=new SR();r.lang='hi-IN';r.interimResults=false;r.onresult=e=>{$("#input").value=e.results[0][0].transcript};r.start()}
async function refreshUsage(){try{const d=await callAI({action:'usage'});if(d.usage){state.usage=d.usage;renderDrawer()}}catch(e){console.warn(e.message)}}
render();refreshUsage();
</script></body></html>
