<script>
const CONFIG={
  SUPABASE_URL:"https://ralinnuegsbuvlhwpzln.supabase.co",
  FUNCTION_NAME:"palia-ai"
};

const state={
  messages:[],
  currentChatId:null,
  mode:"chat",
  loading:false,
  drawer:false,
  userId:"",
  usage:{used_seconds:0,daily_limit_seconds:7200,remaining_seconds:7200},
  pendingFiles:[],
  conversations:[]
};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function uid(){
  let id=localStorage.getItem("palia_user_id");
  if(!id){
    id="guest_"+crypto.randomUUID();
    localStorage.setItem("palia_user_id",id);
  }
  return id;
}
state.userId=uid();

function endpoint(){
  return CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/"+CONFIG.FUNCTION_NAME;
}

async function callAI(payload){
  const r=await fetch(endpoint(),{
    method:"POST",
    mode:"cors",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({...payload,userId:state.userId,timezone:"Asia/Kolkata"})
  });
  let d={};
  try{d=await r.json()}catch{}
  if(!r.ok) throw new Error(d.error||`Palia AI request failed (${r.status})`);
  return d;
}

function fmt(sec){
  sec=Math.max(0,Math.floor(sec||0));
  if(sec<60)return sec+"s";
  const m=Math.floor(sec/60), h=Math.floor(m/60), mm=m%60;
  return h?`${h}h ${mm}m`:m+"m";
}

function render(){
  document.getElementById("app").innerHTML=`
    <aside class="sidebar">
      <div class="brand"><div class="logo">P</div>Palia AI</div>
      <button class="newchat" id="new">＋ New Chat</button>
      <input class="side-search" id="chatSearch" placeholder="Search chats">
      <div class="side-title">Recent chats</div>
      <div class="history" id="history"></div>
      <div class="bottomside">
        <button class="navbtn" id="tools">⚙ Tools</button>
        <button class="navbtn" id="archived">📁 Archived Chats</button>
        <button class="navbtn" id="about">ⓘ About Palia AI</button>
      </div>
    </aside>
    <main class="main">
      <header class="header" id="header"></header>
      <section class="content">
        <div class="chat" id="chat"></div>
        <div class="composer-wrap" id="composer"></div>
      </section>
    </main>
    <div class="drawer" id="drawer"></div>
    <div class="modal" id="modal"></div>`;
  bind();
  renderHeader();
  renderChat();
  renderHistory();
  renderDrawer();
}

function renderHeader(){
  $("#header").innerHTML=`
    <div class="lefthead">
      <button class="hamb" id="hamb">☰</button>
      <div class="tabs">
        <button class="tab ${state.mode==="chat"?"active":""}" data-mode="chat">Chat</button>
        <button class="tab ${state.mode==="tools"?"active":""}" data-mode="tools">Tools</button>
        <button class="tab ${state.mode==="search"?"active":""}" data-mode="search">Web Search</button>
      </div>
    </div>
    <div class="righthead">
      <button class="iconbtn" id="share" title="Share">↗</button>
      <button class="iconbtn" id="settings" title="Settings">⚙</button>
      <button class="avatar" id="profile" title="Profile">P</button>
    </div>`;
}

function renderChat(){
  const c=$("#chat");
  if(state.mode==="tools"){
    c.innerHTML=`
      <div class="toolpage">
        <h1>AI Tools</h1>
        <p class="muted">Use Palia AI naturally. Upload files or simply tell it what you want.</p>
        <div class="toolgrid">
          <div class="toolcard"><h3>🧠 AI Chat</h3><p>Ask, write, explain, plan, code and reason.</p></div>
          <div class="toolcard"><h3>🌐 Web Search</h3><p>Ask for current information with web sources.</p></div>
          <div class="toolcard"><h3>🖼️ Image Understanding</h3><p>Upload an image and ask what is in it or extract information.</p></div>
          <div class="toolcard"><h3>🎨 Image Creation</h3><p>Ask naturally: “PaliaAPK Hub ka icon bana do”. Palia AI returns the actual image when IMAGE_MODEL is configured.</p></div>
          <div class="toolcard"><h3>✏️ Image Editing</h3><p>Upload an image and ask for an icon, logo, background removal or restyle.</p></div>
          <div class="toolcard"><h3>📄 Files</h3><p>Upload text, PDF, DOC, DOCX and supported files for analysis.</p></div>
          <div class="toolcard"><h3>🎙️ Voice</h3><p>Use your browser microphone for speech input.</p></div>
          <div class="toolcard"><h3>🌍 Translator</h3><p>Translate text and uploaded content.</p></div>
          <div class="toolcard"><h3>💻 Coding</h3><p>Generate, debug and explain code.</p></div>
        </div>
      </div>`;
    $("#composer").innerHTML="";
    return;
  }

  if(!state.messages.length){
    c.innerHTML=`
      <div class="welcome">
        <h1>Hello, I'm Palia AI</h1>
        <p>Ask anything, upload an image or file, search the web, or create something.</p>
        <div class="suggestions">
          <button class="suggest" data-p="Explain something simply">Explain something</button>

          <button class="suggest" data-p="Help me debug this code">Help me code</button>

          <button class="suggest" data-p="Give me ideas for a professional resume">Build a resume</button>

      </div>`;
  }else{
    c.innerHTML=`<div class="messages">
      ${state.messages.map(m=>{
        const attachments=(m.attachments||[]).map(a=>{
          if(a.type==="image"){
            return `<div style="margin-top:8px"><img src="${esc(a.data)}" alt="${esc(a.name)}" style="max-width:280px;max-height:240px;border-radius:12px;display:block"></div>`;
          }
          return `<div style="margin-top:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;font-size:12px">📄 ${esc(a.name)}</div>`;
        }).join("");
        const imageResult=m.imageUrl?`<div style="margin-top:10px"><img src="${esc(m.imageUrl)}" alt="Palia AI generated image" style="max-width:100%;border-radius:14px;display:block"><div style="display:flex;gap:8px;margin-top:8px"><a class="primary" style="text-decoration:none;display:inline-block" href="${esc(m.imageUrl)}" download="palia-ai-image.png">Download</a><button class="mode" onclick="regenerateLast()">Regenerate</button></div></div>`:"";
        const sources=m.sources?.length?`<div class="sources">${m.sources.map(s=>`<a href="${esc(s.url||s.uri)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`).join("")}</div>`:"";
        return `<div class="msg ${m.role==="user"?"user":"ai"}"><div class="bubble">${esc(m.text)}${attachments}${imageResult}${sources}</div></div>`;
      }).join("")}
      ${state.loading?'<div class="msg ai"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>':""}
    </div>`;
  }
  renderComposer();
  c.scrollTop=c.scrollHeight;
}

function renderComposer(){
  $("#composer").innerHTML=`
    <div class="composer">
      <div id="attachmentPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:${state.pendingFiles.length?8:0}px">
        ${state.pendingFiles.map((f,i)=>`
          <div class="palia-file-chip" style="display:flex;align-items:center;gap:7px;border:1px solid #e2e8f0;border-radius:11px;padding:6px 8px;background:#f8fafc">
            ${f.type.startsWith("image/")?`<img src="${esc(f.data)}" style="width:42px;height:42px;object-fit:cover;border-radius:8px">`:`<div style="width:42px;height:42px;border-radius:8px;background:#eef2f7;display:grid;place-items:center">📄</div>`}
            <span style="font-size:12px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span>
            <button type="button" class="palia-file-remove" data-remove="${i}" style="border:0;border-radius:50%;width:24px;height:24px">×</button>
          </div>`).join("")}
      </div>
      <div class="attachrow">
        <button class="attach" id="plus" title="Add image, video or file" style="font-size:22px">+</button>
        <button class="mode ${state.mode==="search"?"active":""}" id="searchMode">${state.mode==="search"?"✓ Web Search":"Web Search"}</button>
        <div id="plusMenu" style="display:none;position:absolute;bottom:86px;margin-left:0;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.12);padding:7px;z-index:20">
          <button class="palia-attach-item" data-kind="image" style="display:block;width:170px;padding:10px;border:0;background:transparent;text-align:left">🖼️ Image</button>
          <button class="palia-attach-item" data-kind="video" style="display:block;width:170px;padding:10px;border:0;background:transparent;text-align:left">🎥 Video</button>
          <button class="palia-attach-item" data-kind="file" style="display:block;width:170px;padding:10px;border:0;background:transparent;text-align:left">📄 File</button>
          <button class="palia-attach-item" data-kind="camera" style="display:block;width:170px;padding:10px;border:0;background:transparent;text-align:left">📷 Camera</button>
        </div>
        <input id="imageInput" type="file" accept="image/*" multiple hidden>
        <input id="videoInput" type="file" accept="video/*" multiple hidden>
        <input id="fileInput" type="file" accept=".pdf,.doc,.docx,.txt,.md,.csv,image/*,video/*" multiple hidden>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
      </div>
      <div class="inputrow">
        <textarea class="textarea" id="input" rows="1" placeholder="Message Palia AI..."></textarea>
        <button class="attach" id="mic" title="Voice input">🎙</button>
        <button class="send" id="send">➤</button>
      </div>
    </div>`;

  $("#input").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
  });
  $("#send").onclick=send;
  $("#mic").onclick=voiceInput;
  $("#searchMode").onclick=()=>{
    state.mode=state.mode==="search"?"chat":"search";
    renderHeader();renderChat();bind();
  };

  $("#plus").onclick=e=>{
    e.stopPropagation();
    const m=$("#plusMenu");
    m.style.display=m.style.display==="none"?"block":"none";
  };
  document.querySelectorAll(".palia-attach-item").forEach(b=>b.onclick=()=>{
    $("#plusMenu").style.display="none";
    const k=b.dataset.kind;
    if(k==="image")$("#imageInput").click();
    if(k==="video")$("#videoInput").click();
    if(k==="file")$("#fileInput").click();
    if(k==="camera")$("#cameraInput").click();
  });
  $("#imageInput").onchange=e=>addFiles(e.target.files);
  $("#videoInput").onchange=e=>addFiles(e.target.files);
  $("#fileInput").onchange=e=>addFiles(e.target.files);
  $("#cameraInput").onchange=e=>addFiles(e.target.files);
  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
    state.pendingFiles.splice(Number(b.dataset.remove),1);renderComposer();
  });
}

async function addFiles(fileList){
  for(const file of [...fileList]){
    if(file.size>100*1024*1024){alert(`${file.name} is too large. Maximum 100 MB.`);continue;}
    const data=await new Promise((resolve,reject)=>{
      const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
    });
    state.pendingFiles.push({name:file.name,type:file.type||"application/octet-stream",data:String(data)});
  }
  renderComposer();
}

function renderHistory(){
  state.conversations=JSON.parse(localStorage.getItem("palia_chats")||"[]");
  for(const c of state.conversations){
    const first=(c.messages||[]).find(m=>m.role==="user");
    if(first && (!c.title || c.title.trim().length<3 || /^[A-Za-z]\s*:$/.test(c.title.trim()))){
      c.title=String(first.text||"New Chat").replace(/\\s+/g," ").trim().slice(0,42)||"New Chat";
    }
  }
  persistChats();
  const h=$("#history"); if(!h)return;
  const q=($("#chatSearch")?.value||"").toLowerCase();
  const list=state.conversations.filter(x=>!x.archived&&String(x.title||"").toLowerCase().includes(q))
    .sort((a,b)=>(b.pinned-a.pinned)||(b.updated_at||0)-(a.updated_at||0));
  h.innerHTML=list.map(x=>`
    <div class="history-item ${x.id===state.currentChatId?"active":""}">
      <button class="history-title" data-open="${esc(x.id)}">${x.pinned?"📌 ":""}${esc(x.title||"New Chat")}</button>
      <button class="chat-menu-btn" data-menu="${esc(x.id)}">⋮</button>
      <div class="chat-menu" data-box="${esc(x.id)}" style="display:none">
        <button data-action="rename" data-id="${esc(x.id)}">✏️ Rename</button>
        <button data-action="pin" data-id="${esc(x.id)}">${x.pinned?"📌 Unpin":"📌 Pin"}</button>
        <button data-action="archive" data-id="${esc(x.id)}">📁 Archive</button>
        <button data-action="delete" data-id="${esc(x.id)}">🗑 Delete</button>
      </div>
    </div>`).join("");
  h.querySelectorAll("[data-menu]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();h.querySelectorAll(".chat-menu").forEach(x=>x.style.display="none");
    h.querySelector(`[data-box="${CSS.escape(b.dataset.menu)}"]`).style.display="block";
  });
  h.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const x=state.conversations.find(c=>c.id===b.dataset.open);
    if(x){state.currentChatId=x.id;state.messages=x.messages||[];state.mode="chat";render();}
  });
  h.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{
    const x=state.conversations.find(c=>c.id===b.dataset.id); if(!x)return;
    if(b.dataset.action==="rename"){const n=prompt("Chat name:",x.title||"New Chat");if(n?.trim())x.title=n.trim();}
    if(b.dataset.action==="pin")x.pinned=!x.pinned;
    if(b.dataset.action==="archive"){x.archived=true;if(state.currentChatId===x.id){state.currentChatId=null;state.messages=[];}}
    if(b.dataset.action==="delete"){showConfirm("Delete this chat?","This conversation will be permanently removed.",()=>{state.conversations=state.conversations.filter(c=>c.id!==x.id);if(state.currentChatId===x.id){state.currentChatId=null;state.messages=[];}persistChats();render();});return;}
    persistChats();renderHistory();
  });
  $("#chatSearch")?.addEventListener("input",renderHistory);
}
function persistChats(){localStorage.setItem("palia_chats",JSON.stringify(state.conversations));}
function ensureChat(title){
  if(!state.currentChatId){
    state.currentChatId=crypto.randomUUID();
    state.conversations.unshift({id:state.currentChatId,title:title||"New Chat",messages:[],pinned:false,archived:false,updated_at:Date.now()});
  }
  return state.conversations.find(x=>x.id===state.currentChatId);
}
function showConfirm(title,text,yes){
  const m=document.createElement("div");m.className="confirm";
  m.innerHTML=`<div class="confirmbox"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="confirm-actions"><button id="cancelC">Cancel</button><button class="danger" id="yesC">Delete</button></div></div>`;
  document.body.appendChild(m);$("#cancelC").onclick=()=>m.remove();$("#yesC").onclick=()=>{m.remove();yes()};
}
function saveConversation(){
  const first=state.messages.find(m=>m.role==="user");
  const c=ensureChat(first?first.text.replace(/\s+/g," ").slice(0,42):"New Chat");
  if(first&&(!c.title||c.title==="New Chat"))c.title=first.text.replace(/\s+/g," ").slice(0,42);
  c.messages=state.messages;c.updated_at=Date.now();persistChats();renderHistory();
}

function renderDrawer(){
  const d=$("#drawer");
  const pct=state.usage.daily_limit_seconds?Math.min(100,(state.usage.used_seconds/state.usage.daily_limit_seconds)*100):0;
  d.innerHTML=`
    <div class="panel">
      <div class="panelhead"><strong>Account & Settings</strong><button class="close" id="closeDrawer">×</button></div>
      <div class="profile"><h3>Palia AI</h3><div class="muted">Guest user · ${esc(state.userId.slice(0,18))}</div></div>
      <div class="usage">
        <div class="usagehead"><span>Daily AI Usage</span><span>${fmt(state.usage.remaining_seconds)} remaining</span></div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="statrow"><span>${fmt(state.usage.used_seconds)} used</span><span>2h daily limit</span></div>
        <p class="muted">Resets every day at 12:00 AM (Asia/Kolkata).</p>
      </div>
      <div class="panelnav">
        <button id="clear">Clear chat history</button>
        <button id="export">Export conversation</button>
        <button id="about2">About Palia AI</button>
      </div>
    </div>`;
  d.classList.toggle("open",state.drawer);
  $("#closeDrawer").onclick=()=>{state.drawer=false;renderDrawer()};
  d.onclick=e=>{if(e.target===d){state.drawer=false;renderDrawer()}};
  $("#clear").onclick=()=>{state.messages=[];localStorage.removeItem("palia_history");state.drawer=false;render();};
  $("#export").onclick=()=>{
    const blob=new Blob([JSON.stringify(state.messages,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="palia-ai-chat.json";a.click();
  };
  $("#about2").onclick=()=>alert("Palia AI — AI assistant developed by ShanPalia.");
}

function bind(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    state.mode=b.dataset.mode;renderHeader();renderChat();bind();
  });
  $("#new")?.addEventListener("click",()=>{state.messages=[];state.pendingFiles=[];state.currentChatId=null;state.mode="chat";render();});
  $("#hamb")?.addEventListener("click",()=>document.querySelector(".sidebar").classList.toggle("mobileopen"));
  $("#profile")?.addEventListener("click",()=>{state.drawer=true;renderDrawer();refreshUsage()});
  $("#settings")?.addEventListener("click",()=>{state.drawer=true;renderDrawer();refreshUsage()});
  $("#share")?.addEventListener("click",()=>navigator.share?navigator.share({title:"Palia AI",text:"Chat with Palia AI"}):alert("Share is not available in this browser."));
  $("#tools")?.addEventListener("click",()=>{state.mode="tools";renderHeader();renderChat();bind()});
  $("#archived")?.addEventListener("click",()=>{
    const archived=JSON.parse(localStorage.getItem("palia_chats")||"[]").filter(x=>x.archived);
    if(!archived.length){alert("No archived chats.");return;}
    const names=archived.map(x=>"• "+(x.title||"Archived Chat")).join("\n");
    if(confirm(names+"\n\nRestore all archived chats?")){
      const all=JSON.parse(localStorage.getItem("palia_chats")||"[]");
      all.forEach(x=>{if(x.archived)x.archived=false;});
      localStorage.setItem("palia_chats",JSON.stringify(all));renderHistory();
    }
  });
  $("#about")?.addEventListener("click",()=>alert("Palia AI — AI assistant developed by ShanPalia."));
  document.querySelectorAll(".suggest").forEach(b=>b.onclick=()=>{
    state.mode=b.dataset.search?"search":"chat";
    renderHeader();renderChat();bind();
    setTimeout(()=>{$("#input").value=b.dataset.p;send()},0);
  });
}

async function refreshUsage(){
  try{
    const d=await callAI({action:"usage"});
    if(d.usage){state.usage=d.usage;renderHeader();renderDrawer();}
  }catch(e){console.warn("Usage:",e.message);}
}

function makeHistory(){
  return state.messages.filter(m=>m.role==="user"||m.role==="assistant").slice(-20).map(m=>({role:m.role,text:m.text}));
}

async function send(){
  if(state.loading)return;
  const input=$("#input");
  const text=(input?.value||"").trim();
  if(!text && !state.pendingFiles.length){alert("Please enter a message or attach a file.");return;}

  const attachments=state.pendingFiles.map(x=>({...x}));
  state.messages.push({role:"user",text:text||"Please analyze the attached file(s).",attachments});
  saveConversation();
  state.pendingFiles=[];
  renderChat();
  state.loading=true;
  renderChat();

  try{
    const wantsImage =
      (/\b(create|generate|make|draw|design|edit|transform|remove|replace|turn|convert|bana|banao|bana do|de do|karo|chahiye|dikhao|do)\b/i.test(text) &&
       /\b(image|icon|logo|picture|photo|background|png|svg|cartoon|3d|avatar|tasveer|photo|icon|logo)\b/i.test(text)) ||
      (/\b(icon|logo|image|photo|tasveer)\b/i.test(text) &&
       /\b(bana|banao|de|do|generate|create|make|chahiye|dikhao)\b/i.test(text));

    const d=await callAI({
      action:state.mode==="search"?"search":wantsImage?"image":"chat",
      message:text,
      history:makeHistory().slice(0,-1),
      attachments
    });

    if(!d.success)throw new Error(d.error||"Palia AI could not answer.");
    state.usage=d.usage||state.usage;

    state.messages.push({
      role:"assistant",
      text:d.text||d.reply||"",
      sources:d.sources||[],
      imageUrl:d.imageUrl||""
    });
    saveConversation();
  }catch(e){
    state.messages.push({role:"assistant",text:"⚠️ "+e.message});
  }finally{
    state.loading=false;
    renderChat();
    renderDrawer();
  }
}

async function regenerateLast(){
  const last=state.messages.filter(m=>m.role==="user").pop();
  if(!last)return;
  const original=[...state.messages];
  state.messages=state.messages.slice(0,-1);
  state.pendingFiles=last.attachments||[];
  const input=$("#input");
  if(input)input.value=last.text;
  await send();
  if(!state.messages.length)state.messages=original;
}

async function voiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Voice input is not supported in this browser.");return;}
  const r=new SR();
  r.lang="hi-IN";r.interimResults=false;
  r.onresult=e=>{$("#input").value=e.results[0][0].transcript};
  r.start();
}

render();
refreshUsage();
</script>
</body></html>
